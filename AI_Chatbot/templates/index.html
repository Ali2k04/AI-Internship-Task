<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Context-Aware AI Chatbot</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --bubble-user: #4f6df5;
    --bubble-bot: #232735;
    --text: #e7e9ee;
    --muted: #8b93a7;
    --accent: #4f6df5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    height: 80vh;
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); font-size: 12px; margin-left: auto; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .meta { font-size: 10px; color: var(--muted); margin-top: 4px; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  input[type=text] {
    flex: 1;
    background: #10131b;
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }
  button.icon { background: #232735; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="dot"></div>
      <h1>AI Assistant</h1>
      <span id="backend-tag"></span>
    </header>
    <div id="chat"></div>
    <form id="chat-form">
      <input type="text" id="message" placeholder="Type a message..." autocomplete="off" />
      <button type="button" id="mic-btn" class="icon" title="Voice input (server mic)">🎤</button>
      <button type="submit">Send</button>
    </form>
  </div>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('chat-form');
const input = document.getElementById('message');
const micBtn = document.getElementById('mic-btn');
const backendTag = document.getElementById('backend-tag');
const userId = 'web_user_' + Math.random().toString(36).slice(2, 8);

function addMessage(text, sender, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function sendMessage(text) {
  addMessage(text, 'user');
  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, user_id: userId })
  });
  const data = await res.json();
  addMessage(data.reply, 'bot', `intent: ${data.intent} · confidence: ${data.confidence}`);
  backendTag.textContent = 'NLP: ' + data.backend;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendMessage(text);
});

micBtn.addEventListener('click', async () => {
  micBtn.disabled = true;
  micBtn.textContent = '...';
  try {
    const res = await fetch('/voice?user_id=' + userId, { method: 'POST' });
    const data = await res.json();
    if (data.error) {
      addMessage(data.error, 'bot');
    } else {
      addMessage(data.heard, 'user');
      addMessage(data.reply, 'bot', `intent: ${data.intent} · confidence: ${data.confidence}`);
    }
  } catch (err) {
    addMessage('Voice request failed: ' + err, 'bot');
  }
  micBtn.disabled = false;
  micBtn.textContent = '🎤';
});

// Greet on load
addMessage("Hello! How can I help you today?", 'bot');
</script>
</body>
</html>
